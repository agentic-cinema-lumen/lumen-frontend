steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_LUMEN_API_KEY=${_NEXT_PUBLIC_LUMEN_API_KEY}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=lumen-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --quiet
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
substitutions:
  _REGION: europe-north1
  _REPOSITORY: lumen-images
  _SERVICE: lumen-real
  # Configure these in the Cloud Build trigger or gcloud submit command.
  # NEXT_PUBLIC_* values are intentionally build-time values for this client branch.
  _NEXT_PUBLIC_API_URL: https://agentic-cinema-hack-git-556431509482.europe-west1.run.app
  _NEXT_PUBLIC_LUMEN_API_KEY: ''
options:
  logging: CLOUD_LOGGING_ONLY
